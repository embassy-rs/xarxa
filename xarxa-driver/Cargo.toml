[package]
name = "xarxa-driver"
version = "0.1.0"
edition = "2024"
description = "Driver trait for the `xarxa` network stack."
documentation = "https://docs.rs/xarxa/"
homepage = "https://github.com/embassy-rs/xarxa"
repository = "https://github.com/embassy-rs/xarxa.git"
readme = "README.md"
keywords = ["ip", "tcp", "udp", "ethernet", "network"]
categories = ["embedded", "network-programming"]
license = "0BSD"

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/xarxa/blob/xarxa-driver-v$VERSION/xarxa-driver/src/"
src_base_git = "https://github.com/embassy-rs/xarxa/blob/$COMMIT/xarxa-driver/src/"
features = ["packetmeta-timestamp", "async"]
target = "x86_64-unknown-linux-gnu"

[package.metadata.docs.rs]
# No feature is on by default, so document everything that adds API. defmt is
# left out: it only adds `defmt::Format` impls.
features = ["async", "packetmeta-timestamp"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
## Derive `defmt::Format` on the types in this crate.
defmt = ["dep:defmt"]

## Enable the async parts of the driver API: `Driver::register_waker`.
async = []

#! ### Packet metadata
## Enable the `PacketMeta::id` field: an opaque number that travels with a packet
## through the whole stack.
packetmeta-id = []
## Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
## `Driver::poll_tx_timestamp`.
##
## Transmit timestamps are correlated back to the packet that produced them by
## `PacketMeta::id`, so this implies `packetmeta-id`.
packetmeta-timestamp = ["packetmeta-id"]

packet-buf-align-2 = []
packet-buf-align-4 = []
packet-buf-align-8 = []
packet-buf-align-16 = []
packet-buf-align-32 = []

# BEGIN AUTOGENERATED CONFIG FEATURES
# Generated by gen_config.py. DO NOT EDIT.
packet-buf-count-1 = []
packet-buf-count-2 = []
packet-buf-count-3 = []
packet-buf-count-4 = []
packet-buf-count-5 = []
packet-buf-count-6 = []
packet-buf-count-7 = []
packet-buf-count-8 = []
packet-buf-count-16 = [] # Default
packet-buf-count-32 = []
packet-buf-count-64 = []
packet-buf-count-128 = []
packet-buf-count-256 = []
packet-buf-count-512 = []
packet-buf-count-1024 = []
packet-buf-count-2048 = []
packet-buf-count-4096 = []

# END AUTOGENERATED CONFIG FEATURES

[dependencies]
document-features = "0.2.11"
defmt = { version = "1", optional = true }

# Targets with 32-bit atomic load/store but no atomic read-modify-write
# (e.g. thumbv6m) take a critical section around pool bitmap updates instead.
[target.'cfg(not(target_has_atomic = "32"))'.dependencies]
critical-section = "1"
