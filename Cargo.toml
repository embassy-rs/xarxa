[dependencies]
xarxa-driver = { version = "0.1", path = "xarxa-driver" }
document-features = "0.2.11"
bitflags = { version = "2", default-features = false }
byteorder = { version = "1", default-features = false }
heapless = { version = "0.9", default-features = false }
libc = { version = "0.2", optional = true }
defmt = { version = "1", optional = true, features = ["ip_in_core"] }
log = { version = "0.4", optional = true }

[dev-dependencies]
# The unit tests run in parallel threads of one process, all sharing the one
# packet pool. The default pool is too small for that.
xarxa-driver = { path = "xarxa-driver", features = ["packet-buf-count-1024"] }
env_logger = "0.11"
rand = "0.8"

[[test]]
name = "packet_pool"
required-features = ["std", "udp", "medium-ip", "ipv4"]

[[example]]
name = "tuntap"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "udp"]

[[example]]
name = "tcp_server"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp-listener"]

[[example]]
name = "tcp_client"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp"]

[[example]]
name = "ping"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "raw-ip"]

[[example]]
name = "dns"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "dns"]

[[example]]
name = "sixlowpan"
required-features = ["std", "log", "medium-ieee802154", "sixlowpan-fragmentation", "sixlowpan-reassembly", "udp", "tcp-listener"]

[[example]]
name = "dhcp"
required-features = ["std", "log", "medium-ethernet", "ipv4", "dhcpv4", "dhcpv4-options"]

[[example]]
name = "multicast"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "multicast", "udp"]

[[example]]
name = "multicast6"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "multicast", "udp"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
