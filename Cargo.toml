[workspace]
members = [".", "xarxa-driver"]
exclude = ["bench", "xarxa_old"]

[package]
name = "xarxa"
version = "0.1.0"
edition = "2024"

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/xarxa/blob/xarxa-v$VERSION/src/"
src_base_git = "https://github.com/embassy-rs/xarxa/blob/$COMMIT/src/"
features = ["async"]  # default features
target = "x86_64-unknown-linux-gnu"

[features]
# All features are enabled by default, except embedded-specific ones (like `defmt`)
default = [
    "alloc",
    "std",
    "log",
    "async",
    "icmp-ping-reply",
    "icmp-errors",
    "medium-ethernet",
    "medium-ip",
    "medium-ieee802154",
    "sixlowpan-fragmentation",
    "sixlowpan-reassembly",
    "ipv4",
    "ipv4-fragmentation",
    "ipv4-reassembly",
    "ipv6",
    "raw-ethernet",
    "raw-ip",
    "udp",
    "tcp",
    "tcp-listener",
    "dhcpv4",
    "dhcpv4-options",
    "hostname",
    "slaac",
    "dns",
    "mdns",
    "multicast",
    "tcp-cubic",
    "tcp-timestamps",
    "tcp-sack",
    "packetmeta-timestamp",
]

## Use the heap. Used for:
## - Address, route tables.
## - Socket slabs
## - Owned interfaces
## - Owned TCP socket buffers
alloc = []
## Enable functionality that requires the Rust standard library: the
## `driver_impls` module (`TunTapDriver`, `RawSocketDriver`, `wait`) and
## `Instant::now()`.
std = ["dep:libc"]
## Waker registration on sockets and on the driver, for building `Future`s on top
## of the stack.
async = ["xarxa-driver/async"]

#! ### Protocol support
## Support interfaces that send and receive Ethernet frames, with the link-layer
## machinery that goes with them (ARP, NDISC, the neighbor cache).
medium-ethernet = []
## Support interfaces that send and receive bare IP packets, without a link-layer
## header.
medium-ip = []
## Support IEEE 802.15.4 interfaces carrying 6LoWPAN (RFC 4944, RFC 6282). Needs `ipv6`.
medium-ieee802154 = ["ipv6"]
## Fragment outgoing 6LoWPAN packets larger than one 802.15.4 frame. Needs `medium-ieee802154`.
sixlowpan-fragmentation = ["medium-ieee802154"]
## Reassemble incoming 6LoWPAN fragments. Needs `medium-ieee802154`.
sixlowpan-reassembly = ["medium-ieee802154"]
## Support IPv4 (and, with `medium-ethernet`, ARP).
ipv4 = []
## Fragment outgoing IPv4 packets larger than the interface MTU. Needs `ipv4`.
ipv4-fragmentation = ["ipv4"]
## Reassemble incoming IPv4 fragments. Needs `ipv4`.
ipv4-reassembly = ["ipv4"]
## Support IPv6 (and, with `medium-ethernet`, NDISC).
ipv6 = []
# Raw socket machinery shared by both modes. Private, do not enable directly.
_raw = []
## Ethernet-mode raw sockets: send and receive whole Ethernet frames. Needs `medium-ethernet`.
raw-ethernet = ["_raw", "medium-ethernet"]
## IP-mode raw sockets: send and receive whole IP packets.
raw-ip = ["_raw"]
## UDP sockets.
udp = []
## TCP sockets.
tcp = []
## TCP listeners, for accepting incoming connections.
tcp-listener = ["tcp"]
## DHCPv4 client, built into the interface. Needs `ipv4` and `medium-ethernet`.
dhcpv4 = ["ipv4", "medium-ethernet"]
## Allow reading received DHCP options.
## Requires a small buffer. Size is set by the `dhcp-options-buf-size-N` features.
dhcpv4-options = ["dhcpv4"]
## Give the stack a hostname, with `Stack::set_hostname`. If set, it is sent
## to the DHCP server in outgoing DHCP messages.
hostname = []
## IPv6 stateless address autoconfiguration (SLAAC). Needs `ipv6`, and
## `medium-ethernet` or `medium-ieee802154`.
slaac = ["ipv6"]
## DNS client.
dns = ["udp"]
## Resolve `.local` names with multicast DNS in the DNS client.
mdns = ["dns"]
## Join IP multicast groups, with IGMP (IPv4) and MLD (IPv6) membership reports.
multicast = []
## Send and receive the TCP timestamp option (RFC 7323).
tcp-timestamps = ["tcp"]
## Send selective acknowledgement ranges (RFC 2018).
tcp-sack = ["tcp"]
## Automatically reply to pings (ICMP echo requests).
icmp-ping-reply = []
## Bind sockets to an interface with `bind_to_iface`. A bound socket only
## receives packets that arrive on that interface, and only sends out of it.
iface-bind = []
## Deliver incoming ICMP error messages (destination unreachable, packet too big, ...) to
## the sockets that provoked them.
icmp-errors = []

#! ### TCP congestion control
#! Enable one of these features to enable congestion control. No feature enabled means
#! no congestion control. You may enable at most one.
## Use the Reno congestion control algorithm on TCP sockets.
tcp-reno = ["tcp"]
## Use the CUBIC congestion control algorithm on TCP sockets. Warning: it uses `f64` arithmetic which can be slow and pull in soft-float code depending on the target.
tcp-cubic = ["tcp"]

#! ### Packet metadata
## Enable the `PacketMeta::id` field: an opaque number that travels with a packet
## through the whole stack.
packetmeta-id = ["xarxa-driver/packetmeta-id"]
## Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
## `Driver::poll_tx_timestamp`.
##
## Transmit timestamps are correlated back to the packet that produced them by
## `PacketMeta::id`, so this implies `packetmeta-id`.
packetmeta-timestamp = ["packetmeta-id", "xarxa-driver/packetmeta-timestamp"]

#! ### Logging
## Log with the `log` crate.
log = ["dep:log"]
## Log with the `defmt` crate.
defmt = ["dep:defmt", "heapless/defmt", "xarxa-driver/defmt"]
## Log every packet received and sent, decoded.
## Needs `log` or `defmt` to print anything.
packet-log = []

